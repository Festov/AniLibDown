name: Build IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'release_*'
      - 'update*'

permissions:
  contents: write

jobs:
  test-and-build:
    name: Тесты и сборка IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Run unit tests
        run: |
          set -o pipefail
          # Prefer any available iPhone simulator on the runner
          SIM_NAME=$(xcrun simctl list devices available | rg -o 'iPhone [^()]+\(' | head -1 | sed 's/ ($//' || true)
          if [ -z "$SIM_NAME" ]; then
            SIM_NAME="iPhone 16"
          fi
          echo "Using simulator: $SIM_NAME"
          xcodebuild \
            -project AniLibDown/AniLibDown.xcodeproj \
            -scheme AniLibDown \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log || {
              echo "=== TEST FAILURES ==="
              rg "error:|failed|TEST FAILED" test.log | head -80 || tail -n 120 test.log
              exit 1
            }

      - name: SwiftLint (optional)
        continue-on-error: true
        run: |
          if command -v swiftlint >/dev/null; then
            swiftlint --config .swiftlint.yml
          else
            echo "SwiftLint not installed, skipping"
          fi

      - name: Build for iPhone (без подписи)
        run: |
          set -o pipefail
          xcodebuild \
            -project AniLibDown/AniLibDown.xcodeproj \
            -scheme AniLibDown \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath DerivedData \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log || {
              echo "=== BUILD ERRORS ==="
              rg "error:|warning:.*treated as error|failed" build.log | head -80 || tail -n 120 build.log
              exit 1
            }

      - name: Упаковать .ipa
        run: |
          set -euo pipefail
          APP_PATH=$(find DerivedData -path '*Release-iphoneos/AniLibDown.app' -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "AniLibDown.app не найден"
            find DerivedData -name '*.app' -type d
            exit 1
          fi
          echo "Найдено приложение: $APP_PATH"
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          cd dist
          zip -qr AniLibDown.ipa Payload
          rm -rf Payload
          ls -lh AniLibDown.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AniLibDown-ipa
          path: dist/AniLibDown.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 1.1.4
          files: dist/AniLibDown.ipa
          generate_release_notes: false
                    body: |
            ## Что нового

            - Уведомления снова по дню выхода в выбранное время (не по факту открытия приложения)
            - Выбор часа напоминания в настройках
            - Разные тексты уведомлений со сленгом
            - Вход в AniLiberty больше не обязателен
            - Скрыты «Смотреть» / «Все серии», если серий нет
            - Нулевые серии (рекапы) видны в списке
            - Раскрываемые длинные названия в карточке
            - Можно убрать тайтл из «Продолжить просмотр»
            - Плашка «Онгоинг» в красных тонах приложения
            - Пункт «Поддержать проект» (Patreon / Boosty)
            - Мягче скелетон-шиммер
            - Версия `1.1.4 • AniLibDown`

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
